description: >-
  Well-known discovery probe across the Power Query / Microsoft Fabric host set.
  The product hosts themselves (api.fabric.microsoft.com / api.powerbi.com,
  learn.microsoft.com) serve nothing at /.well-known/. Microsoft centralises the
  two documents that do exist: the RFC 9116 security.txt on msrc.microsoft.com
  (which declares www.microsoft.com/.well-known/security.txt as its Canonical URI)
  and OIDC discovery on login.microsoftonline.com, which is the authorization
  server every Fabric / Power BI REST call authenticates against.
hit_count: 2
hosts:
