      Microsoft Security Response Center. Company-wide security.txt; its own
      Canonical field names https://www.microsoft.com/.well-known/security.txt,
      which is fronted by a bot challenge (403) for non-browser clients.
    documents:
      - path: /.well-known/security.txt
        status: 200
        file: power-query-security.txt
