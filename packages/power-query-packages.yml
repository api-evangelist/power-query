    install: npm install @microsoft/powerquery-parser
    official: true
    version: 2.0.0
    published: '2026-08-25'
    repository: https://github.com/microsoft/powerquery-parser
    license: MIT
    note: Lexer/parser for the Power Query / M formula language, written in TypeScript.
