provider: Power Query
providerId: power-query
description: >-
  First-party Microsoft libraries and tooling for the Power Query / M formula
  language and for the Fabric REST surface that executes Power Query dataflows.
  There is no conventional REST "client SDK" for Power Query: Microsoft ships the
  language toolchain (parser, formatter, language services) as npm packages, the
  connector SDK as a VS Code extension, and the Fabric API client surface as the
  `fab` CLI on PyPI.
