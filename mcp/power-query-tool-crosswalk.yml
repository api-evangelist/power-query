description: >-
  Crosswalk between the MCP tools an agent can reach for Power Query and the REST
  operations Microsoft publishes for the Power Query (Fabric Dataflow) surface.
  The finding is a total divergence: the MCP surface is documentation retrieval
  and the REST surface is dataflow control. Not one MCP tool binds to a REST
  operation, and not one REST operation is exposed as a tool. An agent that can
  talk MCP to Microsoft today can read about Power Query; it cannot run a query.
